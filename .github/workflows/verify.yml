name: Verify User Service
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: squadyatra_test
          POSTGRES_USER: squadyatra_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squadyatra_test -d squadyatra_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and Package Against PostgreSQL
        run: sh ./mvnw -B clean verify
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/squadyatra_test
          TEST_DATABASE_USERNAME: squadyatra_test
          TEST_DATABASE_PASSWORD: ci-only-password
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports