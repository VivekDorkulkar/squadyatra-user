services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: squadyatra
      POSTGRES_USER: ${DATABASE_USERNAME:-squadyatra_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - user_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d squadyatra"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  user_postgres: