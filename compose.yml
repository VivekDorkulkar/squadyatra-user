services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: squadyatra
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - user_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  user_mysql: