services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DATABASE:-squadyatra}
      POSTGRES_USER: ${LOCAL_POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - user_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  user_postgres: