server:
  port: ${PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: squadyatra-user
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/squadyatra}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:Vivek@1995}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
supabase:
  auth:
    url: ${SUPABASE_URL:https://sfyvzgfkcfrbipuseisz.supabase.co}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:sb_publishable_vj_LcujLawRXhMV96IV1Nw_h8FbpibS}
    password-reset-redirect: ${PASSWORD_RESET_REDIRECT:http://localhost:5174/reset-password}
    email-confirmation-redirect: ${EMAIL_CONFIRMATION_REDIRECT:http://localhost:5174/login}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db